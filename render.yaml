services:
  - type: web
    name: mystat-tg-miniapp
    env: node
    plan: free
    region: frankfurt # or oregon / ohio
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: PING_INTERVAL_MINUTES
        value: "9"
